name: ConfinedSpaceLog
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ""
targets:
  ConfinedSpaceLog:
    type: application
    platform: iOS
    sources:
      - path: ConfinedSpaceLog
      - path: Shared
    dependencies:
      - target: ConfinedSpaceLogWidget
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.confined-space-log
        TARGETED_DEVICE_FAMILY: "1"
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_ENTITLEMENTS: ConfinedSpaceLog/ConfinedSpaceLog.entitlements
    info:
      path: ConfinedSpaceLog/Info.plist
      properties:
        CFBundleDisplayName: Confined Space Log
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        # PhotoField needs these. Say what the photo is actually for; Apple rejects vague strings.
        NSCameraUsageDescription: Take a photo to attach to a record.
        NSPhotoLibraryUsageDescription: Choose a photo to attach to a record.
        ITSAppUsesNonExemptEncryption: false
  ConfinedSpaceLogWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: ConfinedSpaceLogWidget
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.confined-space-log.widget
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_ENTITLEMENTS: ConfinedSpaceLogWidget/ConfinedSpaceLogWidget.entitlements
        SKIP_INSTALL: YES
    info:
      path: ConfinedSpaceLogWidget/Info.plist
      properties:
        CFBundleDisplayName: Confined Space Log Widget
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
  ConfinedSpaceLogTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: ConfinedSpaceLogTests
    dependencies:
      - target: ConfinedSpaceLog
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.confined-space-log.tests
        GENERATE_INFOPLIST_FILE: YES
  ConfinedSpaceLogUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: ConfinedSpaceLogUITests
    dependencies:
      - target: ConfinedSpaceLog
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.confined-space-log.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: ConfinedSpaceLog
schemes:
  ConfinedSpaceLog:
    build:
      targets:
        ConfinedSpaceLog: all
        ConfinedSpaceLogTests: [test]
        ConfinedSpaceLogUITests: [test]
    run:
      config: Debug
      storeKitConfiguration: ConfinedSpaceLog/StoreKit/Products.storekit
    test:
      config: Debug
      storeKitConfiguration: ConfinedSpaceLog/StoreKit/Products.storekit
      targets:
        - ConfinedSpaceLogTests
        - ConfinedSpaceLogUITests
    archive:
      config: Release
